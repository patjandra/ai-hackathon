# Render blueprint — single Node web service that builds the React frontend,
# builds the Express backend, then serves the SPA + API + Deepgram WebSocket
# from one origin. Redis is external (Redis Cloud via REDIS_URL).
#
# Deploy: push to GitHub, then in Render → New → Blueprint, point at this repo.
# Render will prompt for every env var marked `sync: false` (the secrets).
services:
  - type: web
    name: interim
    runtime: node
    plan: free
    healthCheckPath: /health
    # --include=dev: NODE_ENV=production (below) would otherwise make npm skip
    # devDependencies, but the build tools (vite, typescript, tailwind) live there.
    buildCommand: >-
      npm install --include=dev --prefix frontend &&
      npm run build --prefix frontend &&
      npm install --include=dev --prefix backend &&
      npm run build --prefix backend
    startCommand: node backend/dist/backend/src/index.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Secrets — Render prompts for these on first deploy (never committed).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TOKEN_COMPANY_API_KEY
        sync: false
      - key: ARIZE_SPACE_ID
        sync: false
      - key: ARIZE_API_KEY
        sync: false
